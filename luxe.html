<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
 <title>出勤・退勤 System</title>

  <link rel="stylesheet" href="style3.css">
</head>

<body>

  <div class="container">

    <h1>出勤・退勤 管理 System</h1>

    <!-- Company Info -->

    <div class="info-box">

      <input type="text" id="company" placeholder="Company Name">

      <input type="text" id="code" placeholder="Company Code">

      <input type="text" id="employee" placeholder="Your Name">

    </div>

    <!-- Buttons -->

    <div class="btn-box">

      <button class="start-btn" onclick="startWork()">
        出勤
      </button>

      <button class="end-btn" onclick="endWork()">
        退勤
      </button>

    </div>

    <!-- Table -->

    <table>

      <thead>

        <tr>
          <th>Date</th>
          <th>Company</th>
          <th>Code</th>
          <th>Name</th>
          <th>出勤時間</th>
          <th>退勤時間</th>
          <th>Work Time</th>
        </tr>

      </thead>

      <tbody id="tableBody">

      </tbody>

    </table>

    <!-- Summary -->

    <div class="summary">

      <h2>Monthly Summary</h2>

      <p>
        Total Work Time :
        <strong id="totalWork">0</strong> hrs
      </p>

    </div>

  </div>

  <script src="script.js"></script>

</body>

</html>
